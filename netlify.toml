[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions.listings]
  timeout = 26

[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirect rules (including SPA fallback) live in public/_redirects.
# /api/* is rewritten to the listings function before the /* → index.html rule.

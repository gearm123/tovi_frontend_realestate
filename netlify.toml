[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions.listings]
  timeout = 26
  included_files = ["netlify/functions/fonts/NotoSansHebrew-Regular.ttf"]

[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The hero file is versioned with ?v= in HERO_ASSET_REV. Bump that when the video changes.
[[headers]]
  for = "/assets/properhero.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect rules (including SPA fallback) live in public/_redirects.
# /api/* is rewritten to the listings function before the /* → index.html rule.

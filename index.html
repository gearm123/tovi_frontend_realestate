<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ProperTLV is boutique English-speaking real estate in Tel Aviv. Luxury apartments for sale and rent."
    />
    <meta property="og:site_name" content="ProperTLV" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/assets/hero.jpg" />
    <title>PROPERTLV | נדל״ן בתל אביב</title>
  </head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="propertyId" />
      <input type="text" name="agentId" />
      <input type="text" name="agentEmail" />
      <input type="text" name="bot-field" />
    </form>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <form name="lead-capture" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="interest" />
      <input type="text" name="sourcePage" />
      <input type="text" name="recipientEmail" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
